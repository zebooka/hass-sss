snapshot:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: camera
    filename:
      required: true
      example: "/config/www/snapshot.jpg"
      selector:
        text:
    width:
      selector:
        number:
          min: 1
          max: 10000
          mode: box
    height:
      selector:
        number:
          min: 1
          max: 10000
          mode: box
    timeout:
      default: 10
      selector:
        number:
          min: 1
          max: 3600
          mode: box
          unit_of_measurement: s
